<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef2f5;--ink:#14202b;--mute:#5d6b78;--card:#fff;--line:#d7dfe6;--acc:#0f6e8c;--hi:#c9822b;--ok:#2e7d5b}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
header{display:flex;gap:12px;align-items:center;padding:14px 18px;background:var(--ink);color:#fff;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:800;margin-right:auto}
.tabs button{background:none;border:0;color:#9fb0bf;padding:6px 12px;cursor:pointer;font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-color:var(--hi)}
.lnk{background:none;border:0;color:#9fb0bf;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:0}
.bar input{flex:1 1 180px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#b3402f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:14px}
.card.p1{border-left-color:var(--hi)}.card.p2{border-left-color:var(--acc)}
.card h3{margin:0 0 4px;font-size:16px}
.price{font-weight:800;font-size:18px;color:var(--acc)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#e3edf2;margin:0 4px 4px 0}
.tag.sell{background:#fbeedc}.tag.rent{background:#dff0e8}
.sub{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row button{padding:5px 10px;font-size:13px}
.empty{padding:40px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:10px;padding:18px;width:min(520px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(20,32,43,.5)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
dialog input,dialog select,dialog textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#auth{max-width:340px;margin:12vh auto;background:#fff;padding:24px;border-radius:10px;border:1px solid var(--line)}
#auth input{width:100%;padding:9px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px}
.err{color:#b3402f;font-size:13px;min-height:18px}
.card.ok{border-left-color:var(--ok)}.card.bad{border-left-color:#b3402f}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.dash .wide{grid-column:1/-1}
.big{font-size:34px;font-weight:800;line-height:1.1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px}
.bar input.n{flex:0 1 128px}
.stat{border:0;border-radius:12px;color:#fff;padding:16px}.stat .sub{color:rgba(255,255,255,.88)}
.s-total{background:#2457a6}.s-pend{background:#b26a00}.s-won{background:#218a5b}.s-lost{background:#c0453a}
.brk{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.seg{display:flex;height:22px;background:#e8eef2;border-radius:6px;overflow:hidden;flex:1}
.seg span{color:#fff;font-size:12px;text-align:center;line-height:22px;min-width:18px}
.brow{display:flex;align-items:center;gap:8px;margin:8px 0}.bl{width:96px;font-size:13px;text-transform:capitalize}.bn{width:24px;font-weight:800;text-align:right}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.cols{display:flex;gap:10px;align-items:flex-end;height:150px}.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.col i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:2px}.col span{font-size:12px;color:var(--mute)}
.hot{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.hot .price{margin-left:auto;font-size:15px}
.chip{display:inline-block;padding:6px 14px;border-radius:99px;color:#fff;font-weight:600;margin:0 6px 6px 0}
.s-od{background:#a3265c}.s-td{background:#0f6e8c}
.tag.od{background:#f6d9d5;color:#8f2a1f}.tag.td{background:#fbeedc;color:#8a5200}.tag.up{background:#dde8f6;color:#1d4a8a}
.note{padding:8px 0;border-bottom:1px solid var(--line);white-space:pre-wrap}
.s-pipe{background:#4b4bb0}.s-recv{background:#1b6b4a}.s-bro{background:#7a4bb3}.s-net{background:#0b5f6e}
.stat.m .big{font-size:28px}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
</style></head><body>

<div id="auth" class="hide">
  <h2 style="margin-top:0">Property Desk</h2>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="aerr"></div>
  <button class="btn" onclick="doAuth(false)">Sign in</button>
  <button class="btn ghost" onclick="doAuth(true)">Create account</button>
</div>

<div id="app" class="hide">
  <header>
    <h1>Property Desk</h1>
    <div class="tabs"><button id="t-dash" class="on" onclick="setTab('dash')">Dashboard</button><button id="t-props" onclick="setTab('props')">Properties</button><button id="t-cons" onclick="setTab('cons')">Contacts</button></div>
    <button class="lnk" onclick="signOut()">Sign out</button>
  </header>
  <main>
    <div class="bar" id="bar"></div>
    <div class="grid" id="list"></div>
  </main>
</div>

<dialog id="dlg"></dialog>

<script>
const SUPABASE_URL = 'https://mbmrzyhcjivrbiaayiah.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibXJ6eWhjaml2cmJpYWF5aWFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NDc4NDIsImV4cCI6MjA5NjIyMzg0Mn0.ozK0aUNvYfogJeLVnwkgGjBxGtHI_xl2f0P22GiTgAU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let org = null, props = [], cons = [], notes = [], tab = 'dash', cur = null;
const PRI = [[1,'High'],[2,'Medium'],[3,'Low']];
const CATS = ['residential','commercial','industrial','land','other'];
const BHKS = ['1RK','1BHK','2BHK','3BHK','4BHK','5BHK+'];
const PF = [['title','Title','text'],['deal_type','Deal','sel',[['sell','Selling'],['buy','Buying'],['rent','Rental']]],['category','Category','sel',CATS],['bhk','BHK','sel',[['', 'Not applicable'], ...BHKS]],['location','Location / area','text'],['city','City','text'],['area_sqft','Size (sq ft)','number'],['floor','Floor (0 = ground)','number'],['price','Price (₹)','number'],['status','Status','sel',['available','negotiating','closed','lost','on hold']],['priority','Priority','sel',PRI],['next_follow_up','Next follow-up','date'],['seller_id','Seller / owner','contact'],['buyer_id','Buyer / tenant','contact'],['broker_id','Broker (if any)','broker'],['broker_share_pct','Broker share (% of commission)','number'],['commission_expected','Expected commission (₹)','number'],['commission_received','Received commission (₹)','number'],['notes','Notes','area']];
const CF = [['name','Name','text'],['kind','Type','sel',['buyer','seller','tenant','landlord','broker']],['phone','Phone','text'],['email','Email','text'],['budget_min','Budget min (₹)','number'],['budget_max','Budget max (₹)','number'],['preferred_location','Preferred location','text'],['preferred_category','Preferred category','sel',['',...CATS]],['priority','Priority','sel',PRI],['notes','Notes','area']];

function fmt(n){ if (n == null || n === '') return '—'; n = Number(n); if (n >= 1e7) return '₹' + (n/1e7).toFixed(2) + ' Cr'; if (n >= 1e5) return '₹' + (n/1e5).toFixed(2) + ' L'; return '₹' + n.toLocaleString('en-IN'); }
function show(id){ $('#auth').classList.toggle('hide', id !== 'auth'); $('#app').classList.toggle('hide', id !== 'app'); }

async function doAuth(signup){
  const email = $('#em').value.trim(), password = $('#pw').value;
  const r = signup ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
  if (r.error) { $('#aerr').textContent = r.error.message; return; }
  if (signup && !r.data.session) { $('#aerr').textContent = 'Check your email to confirm, then sign in.'; return; }
  boot();
}
async function signOut(){ await sb.auth.signOut(); show('auth'); }
async function boot(){
  const s = await sb.auth.getSession();
  if (!s.data.session) { show('auth'); return; }
  const m = await sb.from('re_members').select('org_id').eq('user_id', s.data.session.user.id).limit(1);
  if (m.data && m.data.length) org = m.data[0].org_id;
  else { const r = await sb.rpc('re_bootstrap'); if (r.error) { alert(r.error.message); return; } org = r.data; }
  show('app'); await load();
}
async function load(){
  const r = await Promise.all([sb.from('re_properties').select('*'), sb.from('re_contacts').select('*'), sb.from('re_notes').select('*')]);
  props = r[0].data || []; cons = r[1].data || []; notes = r[2].data || [];
  buildBar(); render();
}

function opts(list, sel){ return list.map(o => { const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : (o || 'Any'); return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join(''); }
function buildBar(){
  if (tab === 'dash') { $('#bar').innerHTML = ''; return; }
  const keep = {q: ($('#q') || {}).value || '', d: ($('#fd') || {}).value || '', c: ($('#fc') || {}).value || '', s: ($('#fs') || {}).value || '', o: ($('#so') || {}).value || '', b: ($('#mb') || {}).value || ''};
  let h = '<input id="q" placeholder="' + (tab === 'props' ? 'Try: 2BHK rental, shop sale, plot Pune' : 'Search name, phone, location') + '" oninput="render()" value="' + esc(keep.q) + '">';
  if (tab === 'props') {
    h += '<select id="fd" onchange="render()">' + opts([['', 'All deals'], ['sell', 'Selling'], ['buy', 'Buying'], ['rent', 'Rental']], keep.d) + '</select>';
    h += '<select id="fc" onchange="render()">' + opts([['', 'All categories'], ...CATS.map(c => [c, c])], keep.c) + '</select>';
    h += '<select id="fs" onchange="render()">' + opts([['', 'All statuses'], 'available', 'negotiating', 'closed', 'lost', 'on hold'], keep.s) + '</select>';
    h += '<select id="mb" onchange="render()"><option value="">Match for client…</option>' + cons.filter(c => c.kind === 'buyer' || c.kind === 'tenant').map(c => '<option value="' + c.id + '"' + (c.id === keep.b ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select>';
    h += '<select id="so" onchange="render()">' + opts([['priority', 'Sort: priority'], ['price_asc', 'Price: low to high'], ['price_desc', 'Price: high to low'], ['location', 'Location A–Z'], ['followup', 'Follow-up date'], ['newest', 'Newest']], keep.o) + '</select>';
    const kv = id => ($('#' + id) || {}).value || '';
    const nb = (id, ph) => '<input class="n" id="' + id + '" type="number" min="0" placeholder="' + ph + '" oninput="render()" value="' + esc(kv(id)) + '">';
    h += '<div style="flex-basis:100%"></div><select id="fb" onchange="render()">' + opts([['', 'Any BHK'], ...BHKS], kv('fb')) + '</select><select id="ff" onchange="render()">' + opts([['', 'Any follow-up'], ['od', 'Overdue'], ['td', 'Due today'], ['wk', 'Next 7 days'], ['none', 'No date set']], kv('ff')) + '</select><input id="fl" placeholder="Location or area" oninput="render()" value="' + esc(kv('fl')) + '">' + nb('smin', 'Size min (sq ft)') + nb('smax', 'Size max') + nb('pmin', 'Price min (₹ lakh)') + nb('pmax', 'Price max (₹ lakh)') + nb('fmin', 'Floor min') + nb('fmax', 'Floor max') + '<button class="btn ghost" onclick="clearF()">Clear filters</button><span class="sub" id="cnt"></span>';
  } else {
    h += '<select id="fd" onchange="render()">' + opts([['', 'All types'], 'buyer', 'seller', 'tenant', 'landlord', 'broker'], keep.d) + '</select>';
    h += '<select id="so" onchange="render()">' + opts([['priority', 'Sort: priority'], ['budget', 'Budget: high to low'], ['location', 'Location A–Z'], ['newest', 'Newest']], keep.o) + '</select>';
  }
  h += '<button class="btn" onclick="openForm()">+ Add</button><button class="btn ghost" onclick="exportCsv()">Export CSV</button>';
  $('#bar').innerHTML = h;
}
function setTab(t){ tab = t; ['dash','props','cons'].forEach(k => $('#t-' + k).classList.toggle('on', k === t)); buildBar(); render(); }

const SYN = {rent: ['deal_type', 'rent'], rental: ['deal_type', 'rent'], rented: ['deal_type', 'rent'], lease: ['deal_type', 'rent'], sale: ['deal_type', 'sell'], sell: ['deal_type', 'sell'], selling: ['deal_type', 'sell'], buy: ['deal_type', 'buy'], buying: ['deal_type', 'buy'],
  residential: ['category', 'residential'], flat: ['category', 'residential'], apartment: ['category', 'residential'], house: ['category', 'residential'], villa: ['category', 'residential'],
  commercial: ['category', 'commercial'], shop: ['category', 'commercial'], office: ['category', 'commercial'], industrial: ['category', 'industrial'], warehouse: ['category', 'industrial'], factory: ['category', 'industrial'], land: ['category', 'land'], plot: ['category', 'land']};
function smart(p, q){
  const toks = q.toLowerCase().replace(/(\d)\s*(bhk|rk)/g, '$1$2').split(/\s+/).filter(Boolean);
  const hay = JSON.stringify(p).toLowerCase();
  return toks.every(t => SYN[t] ? p[SYN[t][0]] === SYN[t][1] : hay.includes(t));
}
function matches(p, c){
  if (c.kind === 'buyer' && p.deal_type !== 'sell') return false;
  if (c.kind === 'tenant' && p.deal_type !== 'rent') return false;
  if (c.preferred_category && c.preferred_category !== p.category) return false;
  if (c.preferred_location && !((p.location || '') + ' ' + (p.city || '')).toLowerCase().includes(c.preferred_location.toLowerCase())) return false;
  if (c.budget_max && p.price > c.budget_max) return false;
  if (c.budget_min && p.price < c.budget_min) return false;
  return p.status !== 'closed' && p.status !== 'lost';
}
const byNew = (a, b) => (b.created_at || '') > (a.created_at || '') ? 1 : -1;
const SORT = {
  priority: (a, b) => (a.priority - b.priority) || byNew(a, b),
  price_asc: (a, b) => (a.price || 0) - (b.price || 0),
  price_desc: (a, b) => (b.price || 0) - (a.price || 0),
  budget: (a, b) => (b.budget_max || 0) - (a.budget_max || 0),
  followup: (a, b) => (a.next_follow_up || '9999').localeCompare(b.next_follow_up || '9999'),
  location: (a, b) => ((a.location || a.preferred_location || '')).localeCompare(b.location || b.preferred_location || ''),
  newest: byNew
};
function cname(id){ const c = cons.find(x => x.id === id); return c ? c : null; }
function contactLine(label, id){ const c = cname(id); if (!c) return ''; return '<div class="sub">' + label + ': ' + esc(c.name) + (c.phone ? ' · <a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>' : '') + '</div>'; }

function render(){
  if (tab === 'dash') { renderDash(); return; }
  $('#list').className = 'grid';
  const q = (($('#q') || {}).value || '').toLowerCase(), d = ($('#fd') || {}).value, so = ($('#so') || {}).value || 'priority';
  let rows;
  if (tab === 'props') {
    const c = ($('#fc') || {}).value, s = ($('#fs') || {}).value, bh = ($('#fb') || {}).value, ff = ($('#ff') || {}).value, mb = cname(($('#mb') || {}).value);
    const num = id => { const v = ($('#' + id) || {}).value; return v ? Number(v) : null; };
    const loc = (($('#fl') || {}).value || '').toLowerCase().trim();
    const sm = [num('smin'), num('smax')], pr = [num('pmin'), num('pmax')], fr = [num('fmin'), num('fmax')];
    const inR = (v, r, k) => (r[0] == null || (v != null && v >= r[0] * k)) && (r[1] == null || (v != null && v <= r[1] * k));
    rows = props.filter(p => (!d || p.deal_type === d) && (!c || p.category === c) && (!s || p.status === s) && (!mb || matches(p, mb)) && (!q || smart(p, q)) && (!bh || p.bhk === bh) && fuMatch(p, ff) &&
      (!loc || ((p.location || '') + ' ' + (p.city || '')).toLowerCase().includes(loc)) && inR(p.area_sqft, sm, 1) && inR(p.price, pr, 1e5) && inR(p.floor, fr, 1));
    rows.sort(SORT[so] || SORT.priority);
    if ($('#cnt')) $('#cnt').textContent = rows.length + ' of ' + props.length + ' properties';
    $('#list').innerHTML = rows.length ? rows.map(p =>
      '<div class="card p' + p.priority + '"><h3>' + esc(p.title) + '</h3>' +
      '<span class="tag ' + p.deal_type + '">' + esc({sell:'Selling',buy:'Buying',rent:'Rental'}[p.deal_type]) + '</span><span class="tag">' + esc(p.category) + '</span>' + (p.bhk ? '<span class="tag">' + esc(p.bhk) + '</span>' : '') + '<span class="tag">' + esc(p.status) + '</span>' +
      fuLabel(p) + '<div class="price">' + fmt(p.price) + '</div>' +
      '<div class="sub">' + esc([p.location, p.city].filter(Boolean).join(', ')) + (p.area_sqft ? ' · ' + Number(p.area_sqft).toLocaleString('en-IN') + ' sq ft' : '') + (p.floor != null ? ' · ' + (p.floor === 0 ? 'Ground floor' : 'Floor ' + p.floor) : '') + '</div>' +
      contactLine('Seller', p.seller_id) + contactLine('Buyer', p.buyer_id) + commLine(p) +
      (p.notes ? '<div class="sub">' + esc(p.notes) + '</div>' : '') +
      '<div class="row"><button class="btn ghost" onclick="openForm(\'' + p.id + '\')">Edit</button><button class="btn ghost" onclick="showMatches(\'' + p.id + '\')">Matching clients</button><button class="btn ghost" onclick="openNotes(\'' + p.id + '\')">Notes (' + notes.filter(n => n.property_id === p.id).length + ')</button></div></div>'
    ).join('') : '<div class="empty">No properties yet. Use + Add to enter the first one.</div>';
  } else {
    rows = cons.filter(c => (!d || c.kind === d) && (!q || JSON.stringify(c).toLowerCase().includes(q)));
    rows.sort(SORT[so] || SORT.priority);
    $('#list').innerHTML = rows.length ? rows.map(c =>
      '<div class="card p' + c.priority + '"><h3>' + esc(c.name) + '</h3><span class="tag">' + esc(c.kind) + '</span>' +
      '<div class="sub">' + (c.phone ? '<a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>' : '') + (c.email ? ' · ' + esc(c.email) : '') + '</div>' +
      ((c.budget_min || c.budget_max) ? '<div class="price">' + fmt(c.budget_min) + ' – ' + fmt(c.budget_max) + '</div>' : '') +
      '<div class="sub">' + esc([c.preferred_category, c.preferred_location].filter(Boolean).join(' · ')) + '</div>' +
      (c.notes ? '<div class="sub">' + esc(c.notes) + '</div>' : '') +
      '<div class="row"><button class="btn ghost" onclick="openForm(\'' + c.id + '\')">Edit</button></div></div>'
    ).join('') : '<div class="empty">No contacts yet. Add buyers, sellers, tenants and landlords here.</div>';
  }
}

const PEND = ['available', 'negotiating', 'on hold'];
const COL = {pend: '#b26a00', won: '#218a5b', lost: '#c0453a'};
function clearF(){ document.querySelectorAll('#bar input, #bar select').forEach(e => { if (e.id !== 'so') e.value = ''; }); render(); }
function segBar(r, max){
  const c = st => r.filter(p => st.includes(p.status)).length;
  const w = v => (v * 100 / max) + '%';
  return '<div class="seg">' + [[c(PEND), COL.pend], [c(['closed']), COL.won], [c(['lost']), COL.lost]].map(x => x[0] ? '<span style="width:' + w(x[0]) + ';background:' + x[1] + '">' + x[0] + '</span>' : '').join('') + '</div>';
}
function barBlock(title, keys, field){
  const g = keys.map(k => [k[1], props.filter(p => p[field] === k[0])]);
  const max = Math.max(1, ...g.map(x => x[1].length));
  return '<div><h3>' + title + '</h3>' + g.map(x => '<div class="brow"><div class="bl">' + esc(x[0]) + '</div>' + segBar(x[1], max) + '<div class="bn">' + x[1].length + '</div></div>').join('') + '</div>';
}
function trend(){
  const now = new Date(), m = [], cl = ['#2457a6', '#0f6e8c', '#218a5b', '#b26a00', '#7a4bb3', '#c0453a'];
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); m.push({y: d.getFullYear(), mo: d.getMonth(), l: d.toLocaleString('en', {month: 'short'}), n: 0}); }
  props.forEach(p => { const d = new Date(p.created_at); const x = m.find(k => k.y === d.getFullYear() && k.mo === d.getMonth()); if (x) x.n++; });
  const max = Math.max(1, ...m.map(x => x.n));
  return '<div class="cols">' + m.map((x, i) => '<div class="col"><b>' + x.n + '</b><i style="height:' + (x.n * 100 / max) + 'px;background:' + cl[i] + '"></i><span>' + x.l + '</span></div>').join('') + '</div>';
}
function renderDash(){
  $('#list').className = 'dash';
  const n = st => props.filter(p => st.includes(p.status)).length;
  const total = props.length, pend = n(PEND), won = n(['closed']), lost = n(['lost']);
  const now = new Date();
  const month = props.filter(p => { const d = new Date(p.created_at); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).length;
  const rate = won + lost ? Math.round(won * 100 / (won + lost)) + '% of decided leads' : 'No decided leads yet';
  const stat = (label, val, cls, sub) => '<div class="card stat ' + cls + '"><div class="sub">' + label + '</div><div class="big">' + val + '</div><div class="sub">' + sub + '</div></div>';
  const cc = (k, label, col) => '<span class="chip" style="background:' + col + '">' + cons.filter(c => c.kind === k).length + ' ' + label + '</span>';
  const sum = (arr, f) => arr.reduce((a, p) => a + (Number(f(p)) || 0), 0);
  const pipe = sum(props.filter(p => PEND.includes(p.status)), p => p.commission_expected);
  const recv = sum(props, p => p.commission_received), pay = sum(props, share), net = recv - pay;
  const toCollect = sum(props.filter(p => p.status === 'closed'), p => Math.max(0, (Number(p.commission_expected) || 0) - (Number(p.commission_received) || 0)));
  const bro = cons.filter(c => c.kind === 'broker').map(b => { const r = props.filter(p => p.broker_id === b.id); return {n: b.name, leads: r.length, won: r.filter(p => p.status === 'closed').length, earn: sum(r, share)}; }).sort((a, b) => b.earn - a.earn || b.leads - a.leads).slice(0, 5);
  const live = props.filter(p => p.next_follow_up && p.status !== 'closed' && p.status !== 'lost');
  const odL = live.filter(p => p.next_follow_up < dayStr(0)), tdL = live.filter(p => p.next_follow_up === dayStr(0));
  const due = odL.concat(tdL).sort((a, b) => a.next_follow_up.localeCompare(b.next_follow_up)).slice(0, 8);
  const noDate = props.filter(p => PEND.includes(p.status) && !p.next_follow_up).length;
  const hot = props.filter(p => PEND.includes(p.status) && p.priority === 1).slice(0, 5);
  $('#list').innerHTML =
    stat('Total leads', total, 's-total', month + ' added this month') +
    stat('Pending', pend, 's-pend', n(['available']) + ' available · ' + n(['negotiating']) + ' negotiating · ' + n(['on hold']) + ' on hold') +
    stat('Closed', won, 's-won', rate) +
    stat('Lost', lost, 's-lost', 'Set status to “lost” on a property') +
    stat('Overdue follow-ups', odL.length, 's-od', 'Needs a call today') +
    stat('Due today', tdL.length, 's-td', noDate + ' pending without a date') +
    stat('Expected pipeline', fmt(pipe), 's-pipe m', 'Commission on pending leads') +
    stat('Commission received', fmt(recv), 's-recv m', fmt(toCollect) + ' still to collect on closed deals') +
    stat('Broker share', fmt(pay), 's-bro m', 'Payable on received commission') +
    stat('Net revenue', fmt(net), 's-net m', 'Received after broker share') +
    '<div class="card wide"><h3>Follow-ups to do</h3>' + (due.length ? due.map(p => '<div class="hot"><b>' + esc(p.title) + '</b><span class="sub">' + esc(p.location || '') + '</span>' + fuLabel(p) + '<button class="btn ghost" style="margin-left:auto;padding:4px 10px" onclick="openNotes(\'' + p.id + '\')">Open</button></div>').join('') : '<div class="sub">Nothing due. All caught up.</div>') + '</div>' +
    '<div class="card wide"><div class="brk">' + barBlock('By deal type', [['sell', 'Selling'], ['buy', 'Buying'], ['rent', 'Rental']], 'deal_type') + barBlock('By category', CATS.map(c => [c, c]), 'category') + '</div>' +
      '<div class="leg"><span><i style="background:' + COL.pend + '"></i>Pending</span><span><i style="background:' + COL.won + '"></i>Closed</span><span><i style="background:' + COL.lost + '"></i>Lost</span></div></div>' +
    '<div class="card wide"><h3>New leads, last 6 months</h3>' + trend() + '</div>' +
    '<div class="card wide"><h3>High-priority pending</h3>' + (hot.length ? hot.map(p => '<div class="hot"><b>' + esc(p.title) + '</b><span class="sub">' + esc(p.location || '') + '</span><span class="price">' + fmt(p.price) + '</span></div>').join('') : '<div class="sub">None yet. Set a property’s priority to High to see it here.</div>') + '</div>' +
    '<div class="card wide"><h3>Top brokers</h3>' + (bro.length ? bro.map(b => '<div class="hot"><b>' + esc(b.n) + '</b><span class="sub">' + b.leads + ' leads · ' + b.won + ' closed</span><span class="price">' + fmt(b.earn) + '</span></div>').join('') : '<div class="sub">Add a broker contact, then pick them on a property to track their share.</div>') + '</div>' +
    '<div class="card wide"><h3>Contacts</h3>' + cc('buyer', 'buyers', '#2457a6') + cc('seller', 'sellers', '#218a5b') + cc('tenant', 'tenants', '#0f6e8c') + cc('landlord', 'landlords', '#7a4bb3') + cc('broker', 'brokers', '#b26a00') + '</div>';
}
function share(p){ return (Number(p.commission_received) || 0) * (Number(p.broker_share_pct) || 0) / 100; }
function commLine(p){
  if (!p.commission_expected && !p.commission_received) return '';
  const b = cname(p.broker_id);
  return '<div class="sub">Commission: ' + fmt(p.commission_expected) + ' expected · ' + fmt(p.commission_received || 0) + ' received' + (b ? ' · broker ' + esc(b.name) + ' ' + (p.broker_share_pct || 0) + '%' : '') + '</div>';
}
function dayStr(off){ const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fuState(p){ if (!p.next_follow_up || p.status === 'closed' || p.status === 'lost') return ''; const t = dayStr(0); return p.next_follow_up < t ? 'od' : p.next_follow_up === t ? 'td' : 'up'; }
function fuLabel(p){
  const st = fuState(p); if (!st) return '';
  const d = new Date(p.next_follow_up + 'T00:00:00').toLocaleDateString('en-IN', {day: 'numeric', month: 'short'});
  return '<span class="tag ' + st + '">' + (st === 'od' ? 'Overdue · ' + d : st === 'td' ? 'Follow up today' : 'Follow-up · ' + d) + '</span>';
}
function fuMatch(p, f){
  if (!f) return true;
  if (f === 'none') return !p.next_follow_up;
  const st = fuState(p);
  if (f === 'od') return st === 'od';
  if (f === 'td') return st === 'td';
  return st !== '' && p.next_follow_up >= dayStr(0) && p.next_follow_up <= dayStr(7);
}
function openNotes(id){
  const p = props.find(x => x.id === id);
  const list = notes.filter(n => n.property_id === id).sort((a, b) => b.created_at > a.created_at ? 1 : -1);
  $('#dlg').innerHTML = '<h3 style="margin-top:0">' + esc(p.title) + '</h3><div class="sub">' + esc(p.location || '') + '</div>' +
    '<label>Add a note</label><textarea id="nb" rows="3" placeholder="Call summary, client feedback, next step"></textarea>' +
    '<label>Next follow-up date</label><input id="nd" type="date" value="' + esc(p.next_follow_up || '') + '">' +
    '<div class="row"><button class="btn" onclick="addNote(\'' + id + '\')">Save</button><button class="btn ghost" onclick="$(\'#dlg\').close()">Close</button></div>' +
    '<h4 style="margin:16px 0 4px">History</h4>' +
    (list.length ? list.map(n => '<div class="note"><div class="sub">' + esc(n.author_email || '') + ' · ' + new Date(n.created_at).toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) + '</div>' + esc(n.body) + '</div>').join('') : '<div class="sub">No notes yet.</div>');
  if (!$('#dlg').open) $('#dlg').showModal();
}
async function addNote(id){
  const body = $('#nb').value.trim(), nd = $('#nd').value || null, p = props.find(x => x.id === id);
  if (!body && nd === (p.next_follow_up || null)) { alert('Write a note or change the follow-up date.'); return; }
  if (body) {
    const u = (await sb.auth.getUser()).data.user;
    const r = await sb.from('re_notes').insert({org_id: org, property_id: id, body: body, author_email: u ? u.email : null});
    if (r.error) { alert(r.error.message); return; }
  }
  if (nd !== (p.next_follow_up || null)) {
    const r2 = await sb.from('re_properties').update({next_follow_up: nd}).eq('id', id);
    if (r2.error) { alert(r2.error.message); return; }
  }
  await load(); openNotes(id);
}
function openForm(id){
  const fields = tab === 'props' ? PF : CF, list = tab === 'props' ? props : cons;
  cur = id ? list.find(x => x.id === id) : {priority: 2};
  let h = '<h3 style="margin-top:0">' + (id ? 'Edit' : 'Add') + (tab === 'props' ? ' property' : ' contact') + '</h3><div class="two">';
  fields.forEach(f => {
    const v = cur[f[0]] == null ? '' : cur[f[0]];
    let inp;
    if (f[2] === 'sel') inp = '<select data-k="' + f[0] + '">' + opts(f[3], v) + '</select>';
    else if (f[2] === 'broker') inp = '<select data-k="' + f[0] + '"><option value="">None</option>' + cons.filter(c => c.kind === 'broker').map(c => '<option value="' + c.id + '"' + (c.id === v ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select>';
    else if (f[2] === 'contact') inp = '<select data-k="' + f[0] + '"><option value="">None</option>' + cons.map(c => '<option value="' + c.id + '"' + (c.id === v ? ' selected' : '') + '>' + esc(c.name) + ' (' + c.kind + ')</option>').join('') + '</select>';
    else if (f[2] === 'area') inp = '<textarea rows="3" data-k="' + f[0] + '">' + esc(v) + '</textarea>';
    else inp = '<input data-k="' + f[0] + '" type="' + f[2] + '" value="' + esc(v) + '">';
    h += '<div' + (f[2] === 'area' || f[0] === 'title' || f[0] === 'name' ? ' style="grid-column:1/3"' : '') + '><label>' + f[1] + '</label>' + inp + '</div>';
  });
  h += '</div><div class="row" style="margin-top:14px"><button class="btn" onclick="saveForm()">Save</button><button class="btn ghost" onclick="$(\'#dlg\').close()">Cancel</button>' + (id ? '<button class="btn danger" style="margin-left:auto" onclick="delRow()">Delete</button>' : '') + '</div>';
  $('#dlg').innerHTML = h; $('#dlg').showModal();
}
async function saveForm(){
  const rec = {};
  document.querySelectorAll('#dlg [data-k]').forEach(el => {
    let v = el.value; const k = el.dataset.k;
    if (el.type === 'number') v = v === '' ? null : Number(v);
    else if (k === 'priority') v = Number(v);
    else if (v === '') v = null;
    rec[k] = v;
  });
  const t = tab === 'props' ? 're_properties' : 're_contacts';
  if ((tab === 'props' && !rec.title) || (tab === 'cons' && !rec.name)) { alert('Please enter a ' + (tab === 'props' ? 'title' : 'name') + '.'); return; }
  const r = cur.id ? await sb.from(t).update(rec).eq('id', cur.id) : await sb.from(t).insert(Object.assign({org_id: org}, rec));
  if (r.error) { alert(r.error.message); return; }
  $('#dlg').close(); load();
}
async function delRow(){
  if (!confirm('Delete this record? This cannot be undone.')) return;
  const r = await sb.from(tab === 'props' ? 're_properties' : 're_contacts').delete().eq('id', cur.id);
  if (r.error) { alert(r.error.message); return; }
  $('#dlg').close(); load();
}
function showMatches(id){
  const p = props.find(x => x.id === id);
  const m = cons.filter(c => (c.kind === 'buyer' || c.kind === 'tenant') && matches(p, c)).sort(SORT.priority);
  $('#dlg').innerHTML = '<h3 style="margin-top:0">Clients matching “' + esc(p.title) + '”</h3>' +
    (m.length ? m.map(c => '<div class="card p' + c.priority + '" style="margin-bottom:8px"><b>' + esc(c.name) + '</b> <span class="tag">' + c.kind + '</span><div class="sub">' + (c.phone ? '<a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a> · ' : '') + fmt(c.budget_min) + ' – ' + fmt(c.budget_max) + '</div></div>').join('') : '<div class="empty">No buyers or tenants match this property’s price, location and category.</div>') +
    '<div class="row"><button class="btn ghost" onclick="$(\'#dlg\').close()">Close</button></div>';
  $('#dlg').showModal();
}
function exportCsv(){
  const list = tab === 'props' ? props : cons;
  if (!list.length) return;
  const keys = Object.keys(list[0]).filter(k => k !== 'org_id' && k !== 'created_by');
  const csv = [keys.join(',')].concat(list.map(r => keys.map(k => '"' + String(r[k] == null ? '' : r[k]).replace(/"/g, '""') + '"').join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = (tab === 'props' ? 'properties' : 'contacts') + '.csv'; a.click();
}
boot();
</script>
</body></html>
